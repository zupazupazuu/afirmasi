<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zupazupazuu — Ceritakan Niatmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,450;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf5ee;
    --card:#f6ead9;
    --ink:#3a2f26;
    --muted:#9c8c7c;
    --line:rgba(58,47,38,0.16);
    --accent:#b9884a;
    --accent-soft:#e7cfa4;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 70% 45% at 15% 0%, rgba(185,136,74,0.10), transparent 60%),
      radial-gradient(ellipse 60% 45% at 100% 100%, rgba(231,207,164,0.35), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .intro-logo{
    height:140px; width:auto; display:block;
    margin:0 auto 14px;
  }

  .intro-tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.3rem;
    letter-spacing:0.02em;
    text-transform:none;
    color:var(--ink);
    margin:0 0 28px;
  }

  .progress-bar{
    position:fixed; top:0; left:0; height:2px;
    background:var(--accent); z-index:11;
    width:0%; transition:width 0.4s ease;
  }

  .stage{
    height:100vh; width:100vw;
    position:relative;
  }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 28px 60px;
    opacity:0; pointer-events:none;
    transform:translateY(16px);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .screen.active{
    opacity:1; pointer-events:auto; transform:translateY(0);
  }

  .screen.intro{
    justify-content:flex-start;
    padding-top:6vh;
    text-align:center;
  }
  .screen.intro .inner{
    display:flex; flex-direction:column; align-items:center;
  }

  .inner{
    max-width:560px; width:100%;
  }

  /* intro */
  .intro .eyebrow{
    font-family:'Poppins', sans-serif; font-size:13px; font-weight:500; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); display:block; margin-bottom:22px;
  }
  .intro h1{
    font-family:'Fraunces', serif; font-weight:500; font-optical-sizing:auto;
    font-size:clamp(1.15rem, 2.6vw, 1.45rem); line-height:1.3; margin:40px 0 16px;
  }
  .intro h1 em{ font-style:italic; font-weight:450; color:var(--accent); }
  .intro p{
    color:var(--muted); font-size:1.05rem; font-weight:300; line-height:1.7; margin:0 0 32px; max-width:460px;
  }
  .intro .tags{
    font-family:'Poppins', sans-serif; font-size:12px; font-weight:500; letter-spacing:0.04em;
    display:flex; gap:10px; margin-bottom:40px; color:var(--ink);
  }
  .intro .tags .dot{ color:var(--line); }

  /* question screens */
  .qnum{
    font-family:'Fraunces', serif; font-style:italic; font-size:15px; color:var(--accent);
    display:block; margin-bottom:16px;
  }
  .qtext{
    font-family:'Fraunces', serif; font-weight:500;
    font-size:clamp(1.5rem, 4.2vw, 2.1rem); line-height:1.35; margin:0 0 34px;
  }
  .qbody input, .qbody textarea{
    width:100%; border:none; border-bottom:1.5px solid var(--line);
    background:transparent; font-family:'Poppins', sans-serif; font-weight:300; font-size:1.1rem;
    color:var(--ink); padding:10px 2px 14px; transition:border-color 0.2s ease;
  }
  .qbody textarea{ resize:vertical; min-height:96px; line-height:1.6; }
  .qbody input::placeholder, .qbody textarea::placeholder{ color:#c9b9a4; }
  .qbody input:focus, .qbody textarea:focus{ outline:none; border-color:var(--accent); }
  .qhint{
    font-size:0.85rem; font-weight:300; color:var(--muted); margin-top:12px;
  }
  .qerr{
    display:none; font-size:0.85rem; color:#b0503c; margin-top:12px;
  }
  .screen.invalid .qerr{ display:block; }
  .screen.invalid .qbody input, .screen.invalid .qbody textarea{ border-color:#b0503c; }

  .nav-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:36px;
  }
  .next-btn{
    background:var(--ink); color:var(--bg); border:none;
    font-family:'Poppins', sans-serif; font-size:0.96rem; font-weight:500;
    padding:14px 26px; cursor:pointer; border-radius:999px;
    display:inline-flex; align-items:center; gap:10px;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .next-btn:hover{ background:var(--accent); transform:translateY(-1px); }
  .next-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .next-btn.outline{
    background:transparent; color:var(--ink); border:1.5px solid transparent;
  }
  .next-btn.outline:hover{ background:transparent; color:var(--ink); border-color:var(--ink); transform:translateY(-1px); }
  .back-btn{
    background:none; border:none; color:var(--muted);
    font-family:'Poppins', sans-serif; font-weight:300; font-size:0.92rem; cursor:pointer;
    padding:6px 0;
  }
  .back-btn:hover{ color:var(--ink); }

  /* thanks */
  .thanks .qnum{ display:none; }
  .thanks h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:2.3rem; margin:0 0 30px;
  }
  .affirmation{
    font-family:'Fraunces', serif; font-style:italic; font-weight:450;
    font-size:1.3rem; line-height:1.6; color:var(--ink);
    padding:28px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    margin:0 0 20px;
  }
  .thanks-meta{ color:var(--muted); font-weight:300; font-size:0.94rem; margin:0 0 32px; }
  .disclaimer{ display:inline-block; margin-top:10px; font-size:0.78rem; opacity:0.75; }
  .again-btn{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-family:'Poppins', sans-serif; font-weight:400; font-size:0.9rem; padding:11px 22px; cursor:pointer; border-radius:999px;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .again-btn:hover{ border-color:var(--accent); color:var(--accent); }

  footer{
    position:fixed; bottom:20px; left:0; right:0; text-align:center;
    font-family:'Poppins', sans-serif; font-size:11px; font-weight:400; letter-spacing:0.06em;
    color:var(--muted); pointer-events:none;
  }

  @media (max-width:520px){
    .screen{ padding:50px 22px 50px; }
  }
</style>
</head>

<script>
  const screens = Array.from(document.querySelectorAll('.screen'));
  const progressBar = document.getElementById('progressBar');
  let current = 0;
  const totalQuestions = 2;

  function updateChrome(){
    if(current >= 1 && current <= totalQuestions){
      progressBar.style.width = (current / totalQuestions * 100) + '%';
    } else {
      progressBar.style.width = current === 0 ? '0%' : '100%';
    }
  }

  function showScreen(index){
    screens.forEach(s => s.classList.remove('active'));
    const target = screens.find(s => Number(s.dataset.step) === index);
    if(target){
      target.classList.add('active');
      const field = target.querySelector('input, textarea');
      if(field){ setTimeout(()=>field.focus(), 350); }
    }
    current = index;
    updateChrome();
  }

  function validateStep(index){
    if(index === 1) return document.getElementById('crystal').value.trim().length > 0;
    if(index === 2) return document.getElementById('niat').value.trim().length > 0;
    return true;
  }

  function markInvalid(index, invalid){
    const target = screens.find(s => Number(s.dataset.step) === index);
    if(target) target.classList.toggle('invalid', invalid);
  }

    () => `Aku menikmati proses ini tanpa membandingkan diriku dengan siapa pun.`,
    () => `Aku melepaskan rasa ragu, dan menggantinya dengan kepercayaan yang tenang.`,
    () => `Aku terus melangkah dengan percaya diri, satu hari demi satu hari.`,
    () => `Aku memberi ruang bagi diriku untuk bertumbuh, tanpa terburu-buru.`,
    () => `Aku percaya bahwa setiap usaha kecil sedang membangun sesuatu yang besar.`,
    () => `Aku memilih ketenangan, dan membiarkan semesta bekerja bersamaku.`,
    () => `Aku pantas mendapatkan itu, karena aku terus berusaha dan percaya pada diriku sendiri.`,
    () => `Aku bernapas lega, karena aku tahu aku sedang berada di jalan yang tepat.`,
    () => `Aku berhenti membandingkan waktuku dengan waktu orang lain.`,
    () => `Aku memberi diriku izin untuk bahagia, bahkan sebelum semuanya tercapai.`,
    () => `Aku percaya bahwa semesta selalu punya cara yang lebih baik dari yang kubayangkan.`,
    () => `Aku memilih untuk tetap lembut pada diriku sendiri sepanjang perjalanan ini.`
  ];

  function hashSeed(seed){
    let hash = 0;
    for(let i=0;i<seed.length;i++){ hash = (hash*31 + seed.charCodeAt(i)) >>> 0; }
    return hash;
  }

  function buildAffirmation(crystal, intent, seed){
    const h = hashSeed(seed);
    const prefix = prefixes[h % prefixes.length];
    const opener = openers[Math.floor(h / prefixes.length) % openers.length];
    const middle = middles[Math.floor(h / (prefixes.length * openers.length)) % middles.length];
    const closer = closers[Math.floor(h / (prefixes.length * openers.length * middles.length)) % closers.length];
    const middleText = middle(intent);
    const body = opener(crystal) + ' ' + middleText.charAt(0).toUpperCase() + middleText.slice(1) + '.';
    return `${prefix} ${body} ${closer()}`;
  }

  function cleanIntent(text){
    let t = text.trim().replace(/[.!]+$/,'');
    if(t.length === 0) return t;
    return t.charAt(0).toLowerCase() + t.slice(1);
  }

  function finish(){
    const crystal = document.getElementById('crystal').value.trim();
    const niatRaw = document.getElementById('niat').value.trim();
    const niat = cleanIntent(niatRaw);

    const affirmation = buildAffirmation(crystal, niat, crystal + niatRaw);

    document.getElementById('resultText').textContent = '"' + affirmation + '"';
    document.getElementById('resultMeta').innerHTML = 'Semoga afirmasi crystalmu berhasil.<br><span class="disclaimer">Catatan: Semua fungsi crystal bersifat metafisika. Tidak untuk medis. Crystal tidak bisa mengubah fisik manusia.</span>';

    showScreen(3);
  }

  function goNext(){
    if(current >= 1 && current <= totalQuestions){
      const ok = validateStep(current);
      markInvalid(current, !ok);
      if(!ok) return;
    }
    if(current === totalQuestions){
      finish();
      return;
    }
    showScreen(current + 1);
  }

  function goBack(){
    if(current > 0) showScreen(current - 1);
  }

  document.querySelectorAll('[data-action="next"]').forEach(btn=>{
    btn.addEventListener('click', goNext);
  });
  document.querySelectorAll('[data-action="back"]').forEach(btn=>{
    btn.addEventListener('click', goBack);
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    document.getElementById('crystal').value = '';
    document.getElementById('niat').value = '';
    showScreen(0);
  });

  ['crystal'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); goNext(); }
    });
    el.addEventListener('input', function(){
      const step = Number(this.closest('.screen').dataset.step);
      markInvalid(step, false);
    });
  });

  const niatEl = document.getElementById('niat');
  niatEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); goNext(); }
  });
  niatEl.addEventListener('input', function(){
    markInvalid(2, false);
  });

  updateChrome();
</script>
